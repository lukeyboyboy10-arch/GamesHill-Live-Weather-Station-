    <script>
        // CONFIGURATION: Double-check these are wrapped in quotes!
        const STATION_ID = 'IKILMA132'; 
        const API_KEY = 'b65d463044b340a89d463044b380a821';      

        async function fetchWeatherData() {
            const url = `https://weather.com{STATION_ID}&format=json&units=m&apiKey=${API_KEY}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('API request failed');
                
                const data = await response.json();
                
                // Safety check: ensure observations exist
                if (!data.observations || data.observations.length === 0) {
                    throw new Error('No observation data found for this station ID');
                }

                const obs = data.observations[0];
                const metric = obs.metric || {};

                // Safeguarded UI assignment
                document.getElementById('temperature').innerText = metric.temp !== undefined ? `${metric.temp}°C` : '--°C';
                document.getElementById('humidity').innerText = obs.humidity !== undefined ? `${obs.humidity}%` : '--%';
                document.getElementById('wind').innerText = metric.windSpeed !== undefined ? `${metric.windSpeed} km/h` : '-- km/h';
                document.getElementById('rain').innerText = metric.precipTotal !== undefined ? `${metric.precipTotal} mm` : '-- mm';
                document.getElementById('direction').innerText = obs.winddir !== undefined ? getCardinalDirection(obs.winddir) : '--';
                
                // Weather Underground uses 'pressure' inside the metric object
                document.getElementById('pressure').innerText = metric.pressure !== undefined ? `${metric.pressure} hPa` : '-- hPa';
                
                // Format the timestamp securely
                if (obs.obsTimeLocal) {
                    const obsTime = new Date(obs.obsTimeLocal.replace(/-/g, "/"));
                    document.getElementById('updated').innerText = obsTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                } else {
                    document.getElementById('updated').innerText = "Just now";
                }

            } catch (error) {
                console.error("Dashboard error:", error);
                document.getElementById('updated').innerText = "Connection Error (Check API/Station)";
            }
        }

        // Helper function to turn degrees into directions (e.g. 225° -> SW)
        function getCardinalDirection(angle) {
            if (angle === undefined || angle === null) return '--';
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return directions[Math.round(angle / 45) % 8];
        }

        // Run immediately on page load, then refresh every 2 minutes
        fetchWeatherData();
        setInterval(fetchWeatherData, 120000);
    </script>
