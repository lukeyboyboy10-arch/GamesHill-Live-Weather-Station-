<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather Station</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #eaf4ff; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        h1 { color: #1d3557; }
        .updated { color: #555; margin-bottom: 25px; }
        .weather-grid { 
            max-width: 900px; 
            margin: auto; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
        }
        .weather-card { 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.1); 
        }
        .weather-icon { font-size: 40px; }
        .value { font-size: 30px; font-weight: bold; color: #1d3557; }
        .label { color: #666; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>🌦️ Live GamesHill Weather Statistics</h1>
    <div class="updated">
        Last updated: <span id="updated">Loading...</span>
    </div>

    <div class="weather-grid">
        <div class="weather-card">
            <div class="weather-icon">🌡️</div>
            <div class="value" id="temperature">--°C</div>
            <div class="label">Temperature</div>
        </div>

        <div class="weather-card">
            <div class="weather-icon">💧</div>
            <div class="value" id="humidity">--%</div>
            <div class="label">Humidity</div>
        </div>

        <div class="weather-card">
            <div class="weather-icon">💨</div>
            <div class="value" id="wind">-- km/h</div>
            <div class="label">Wind Speed</div>
        </div>

        <div class="weather-card">
            <div class="weather-icon">🌧️</div>
            <div class="value" id="rain">-- mm</div>
            <div class="label">Rain Today</div>
        </div>

        <div class="weather-card">
            <div class="weather-icon">🧭</div>
            <div class="value" id="direction">--</div>
            <div class="label">Wind Direction</div>
        </div>

        <div class="weather-card">
            <div class="weather-icon">📊</div>
            <div class="value" id="pressure">-- hPa</div>
            <div class="label">Pressure</div>
        </div>
    </div>

    <script>
        // CONFIGURATION: Replace these with your actual Wunderground details
        const STATION_ID = 'IKILMA132'; 
        const API_KEY = 'b65d463044b340a89d463044b380a821';      

        async function fetchWeatherData() {
            const url = `https://weather.com{STATION_ID}&format=json&units=m&apiKey=${API_KEY}`;
            
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Network issue fetching data');
                
                const data = await response.json();
                const obs = data.observations[0];

                // Update UI elements with live data
                document.getElementById('temperature').innerText = `${obs.metric.temp}°C`;
                document.getElementById('humidity').innerText = `${obs.humidity}%`;
                document.getElementById('wind').innerText = `${obs.metric.windSpeed} km/h`;
                document.getElementById('rain').innerText = `${obs.metric.precipTotal} mm`;
                document.getElementById('direction').innerText = getCardinalDirection(obs.winddir);
                document.getElementById('pressure').innerText = `${obs.metric.pressureTrend === null ? obs.metric.pressurePressure : obs.metric.pressurePressure} hPa`;
                
                // Format the observation time
                const obsTime = new Date(obs.obsTimeLocal);
                document.getElementById('updated').innerText = obsTime.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

            } catch (error) {
                console.error("Error loading weather data:", error);
                document.getElementById('updated').innerText = "Error loading data";
            }
        }

        // Helper function to turn degrees into directions (e.g. 225° -> SW)
        function getCardinalDirection(angle) {
            const directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return directions[Math.round(angle / 45) % 8];
