<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Weather Station</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #eaf4ff; 
            margin: 0; 
            padding: 20px; 
            text-align: center; 
        }
        h1 { color: #1d3557; }
        .updated { color: #555; margin-bottom: 25px; }
        .weather-grid { 
            max-width: 900px; 
            margin: auto; 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
            gap: 15px; 
        }
        .weather-card { 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 3px 10px rgba(0,0,0,0.1); 
        }
        .weather-icon { font-size: 40px; }
        .value { font-size: 30px; font-weight: bold; color: #1d3557; }
        .label { color: #666; margin-top: 8px; }
    </style>
</head>
<body>

    <h1>区分️ My Weather Station</h1>
    <div class="updated">
        Last updated: <span id="updated">Connecting to station...</span>
    </div>

    <div class="weather-grid">
        <div class="weather-card">
            <div class="weather-icon">🌡️</div>
            <div class="value" id="temperature">--°C</div>
            <div class="label">Temperature</div>
        </div>

        <div class="weather-card">
            <div class="weather-icon">💧</div>
            <div class="value" id="humidity">--%</div>
            <div class="label">Humidity</div>
        </div>

        <div class="weather-card">
            <div class="weather-icon">💨</div>
            <div class="value" id="wind">-- km/h</div>
            <div class="label">Wind Speed</div>
        </div>

        <div class="weather-card">
            <div class="weather-icon">🌧️</div>
            <div class="value" id="rain">-- mm</div>
            <div class="label">Rain Today</div>
        </div>

        <div class="weather-card">
            <div class="weather-icon">🧭</div>
            <div class="value" id="direction">--</div>
            <div class="label">Wind Direction</div>
        </div>

        <div class="weather-card">
            <div class="weather-icon">📊</div>
            <div class="value" id="pressure">-- hPa</div>
            <div class="label">Pressure</div>
        </div>
    </div>

    <script>
        // CONFIGURATION: Put your keys inside the single quotes
        const STATION_ID = 'IKILMA132'; 
        const API_KEY = 'b65d463044b340a89d463044b380a821';      

        function fetchWeatherData() {
            var url = "https://api.weather.com/v2/pws/observations/current?stationId=" + STATION_ID + "&format=json&units=m&apiKey=" + API_KEY;
            
            fetch(url)
                .then(function(response) {
                    if (!response.ok) {
                        throw new Error("HTTP error " + response.status);
                    }
                    return response.json();
                })
                .then(function(data) {
                    if (!data.observations || data.observations.length === 0) {
                        document.getElementById('updated').innerText = "Station has no recent data upload.";
                        return;
                    }

                    var obs = data.observations[0];
                    var metric = obs.metric || {};

                    // Fill screen elements safely
                    document.getElementById('temperature').innerText = metric.temp !== undefined ? metric.temp + "°C" : "--°C";
                    document.getElementById('humidity').innerText = obs.humidity !== undefined ? obs.humidity + "%" : "--%";
                    document.getElementById('wind').innerText = metric.windSpeed !== undefined ? metric.windSpeed + " km/h" : "-- km/h";
                    document.getElementById('rain').innerText = metric.precipTotal !== undefined ? metric.precipTotal + " mm" : "-- mm";
                    
                    if (obs.winddir !== undefined) {
                        var directions = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
                        document.getElementById('direction').innerText = directions[Math.round(obs.winddir / 45) % 8];
                    } else {
                        document.getElementById('direction').innerText = "--";
                    }
                    
                    document.getElementById('pressure').innerText = metric.pressure !== undefined ? metric.pressure + " hPa" : "-- hPa";
                    
                    if (obs.obsTimeLocal) {
                        document.getElementById('updated').innerText = obs.obsTimeLocal;
                    } else {
                        document.getElementById('updated').innerText = "Online";
                    }
                })
                .catch(function(error) {
                    console.log("Error loading dashboard data: ", error);
                    document.getElementById('updated').innerText = "Offline or invalid keys.";
                });
        }

        // Run immediately, then query servers every 2 minutes
